[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seeg-linear-decoder"
version = "0.1.0"
description = "Leakage-safe channel-wise regression for segmented sEEG grip data"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pyarrow>=12",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
seeg-validate-channels = "seeg_linear_decoder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
